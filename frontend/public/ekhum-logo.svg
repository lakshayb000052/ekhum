<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradient for the continuous giving loop -->
    <linearGradient id="ekhumGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ekhumGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Emblem: Intertwined Philanthropy Heart & Infinity Impact Loop -->
  <g transform="translate(15, 8)" filter="url(#subtleGlow)">
    <!-- Lower Heart Foundation Loop -->
    <path d="M 45 88 L 18 58 C 6 44 6 22 22 10 C 38 -2 55 12 45 32" 
          fill="none" 
          stroke="url(#ekhumGradAccent)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Upper Infinity & Giving Flow Ribbon -->
    <path d="M 45 88 L 72 58 C 84 44 84 22 68 10 C 52 -2 35 12 45 32 C 55 52 82 46 80 26 C 78 12 60 14 45 32" 
          fill="none" 
          stroke="url(#ekhumGradPrimary)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Node / Impact Catalyst Spark -->
    <circle cx="45" cy="32" r="5" fill="#F59E0B" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 68)">
    <!-- 'EK' Emphasis -->
    <text x="0" y="0" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="46" fill="#0F172A" letter-spacing="-1">
      EK<tspan font-weight="600" fill="#2563EB">hum</tspan>
    </text>
    <!-- Tagline -->
    <text x="2" y="24" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="11.5" fill="#64748B" letter-spacing="3.2">
      GLOBAL PHILANTHROPY FINTECH
    </text>
  </g>
</svg>
